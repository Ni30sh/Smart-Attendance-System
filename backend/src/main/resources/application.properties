spring.application.name=smart-attendance-backend

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/attendance_system?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Never#55
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Server Configuration
server.port=8080

# CORS Configuration
management.endpoints.web.cors.allowed-origins=http://localhost:3000
management.endpoints.web.cors.allowed-methods=GET,POST,PUT,DELETE
management.endpoints.web.cors.allowed-headers=*

# Face Recognition Service Configuration
face.recognition.service.url=http://localhost:5000